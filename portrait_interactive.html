<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter For You ♥ - Foto Real Arredondada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07080c;
            color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #ffb4cc;
            text-shadow: 0 0 18px rgba(255, 60, 120, 0.7);
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #ffd299;
            margin-bottom: 24px;
            text-shadow: 0 0 10px rgba(255, 180, 80, 0.5);
            text-align: center;
        }
        .container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas#bgCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        .photo-frame {
            position: relative;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            padding: 5px;
            z-index: 2;
            transition: all 0.5s ease;
            animation: breathe 3.5s ease-in-out infinite alternate;
        }
        .photo-frame.gold {
            background: linear-gradient(135deg, #ffe1a0, #ff9933, #b42846);
            box-shadow: 0 0 50px rgba(255, 140, 60, 0.5), inset 0 0 15px rgba(255, 230, 180, 0.6);
        }
        .photo-frame.ruby {
            background: linear-gradient(135deg, #ffc8dc, #ff3c6e, #a01441);
            box-shadow: 0 0 50px rgba(255, 50, 100, 0.5), inset 0 0 15px rgba(255, 180, 210, 0.6);
        }
        .photo-frame.cyan {
            background: linear-gradient(135deg, #dcfaff, #00d2ff, #1450c8);
            box-shadow: 0 0 50px rgba(0, 180, 255, 0.5), inset 0 0 15px rgba(180, 240, 255, 0.6);
        }
        .photo-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #07080c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        @keyframes breathe {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.025); }
        }
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 3;
        }
        button {
            background: rgba(25, 30, 48, 0.85);
            border: 1px solid rgba(255, 120, 170, 0.4);
            color: #ffb8d0;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button:hover {
            background: rgba(255, 60, 120, 0.35);
            border-color: #ff3c78;
            box-shadow: 0 0 15px rgba(255, 60, 120, 0.6);
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>♥ PARA SEMPRE A RAZÃO DO MEU SORRISO ♥</h1>
    <div class="subtitle">♥ Com todo o meu amor e carinho ♥</div>

    <div class="container">
        <canvas id="bgCanvas" width="720" height="600"></canvas>
        <div id="frame" class="photo-frame gold">
            <div class="photo-inner">
                <img src="photo_rounded.png" alt="Foto Real Arredondada">
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="setTheme('gold')">Ouro & Carmesim</button>
        <button onclick="setTheme('ruby')">Rubi Escarlate</button>
        <button onclick="setTheme('cyan')">Ciano Cyberpunk</button>
    </div>

    <script>
        function setTheme(theme) {
            const frame = document.getElementById('frame');
            frame.className = 'photo-frame ' + theme;
        }

        // Animated particles and anamorphic beams canvas
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.8,
                speedY: -(Math.random() * 0.8 + 0.3),
                speedX: (Math.random() - 0.5) * 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                life: Math.random() * 100
            });
        }

        let time = 0;
        function render() {
            time += 0.03;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Anamorphic horizontal flare
            const cy = canvas.height / 2;
            const grad = ctx.createRadialGradient(canvas.width / 2, cy, 30, canvas.width / 2, cy, 340);
            grad.addColorStop(0, 'rgba(50, 150, 255, 0.25)');
            grad.addColorStop(0.5, 'rgba(30, 90, 200, 0.1)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, cy - 80, canvas.width, 160);

            // Particles
            for (const p of particles) {
                p.y += p.speedY;
                p.x += p.speedX;
                p.life += 1;
                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }
                const pAlpha = (Math.sin(time * 2 + p.life * 0.05) * 0.3 + 0.7) * p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 210, 150, ${pAlpha})`;
                ctx.shadowColor = 'rgba(255, 180, 80, 0.8)';
                ctx.shadowBlur = 8;
                ctx.fill();
            }

            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
